<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Litera Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>Litera Space</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="layanan.html">Layanan</a>
            <a href="koleksi.html">Koleksi</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- HERO -->
    <div class="hero">
        <h2>Login Admin</h2>
        <p>Masuk untuk mengelola konten website dan personal admin.</p>
    </div>

    <!-- LOGIN FORM -->
    <section id="login-form">
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Username / Email:</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username atau email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Litera Space. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
