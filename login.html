<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Daftar - Litera Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>Litera Space</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="layanan.html">Layanan</a>
            <a href="koleksi.html">Koleksi</a>
            <a href="forum.html">Forum</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- HERO -->
    <div class="hero">
        <h2>Selamat Datang</h2>
        <p>Login atau daftar untuk mengakses fitur pengguna.</p>
    </div>

    <!-- LOGIN / DAFTAR MENU -->
    <section id="login-menu">
        <div class="menu-buttons">
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Daftar</button>
        </div>
    </section>

    <!-- LOGIN FORM -->
    <section id="login-form" class="hidden">
        <form id="userLoginForm">
            <div class="form-group">
                <label for="username">Username / Email:</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username atau email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </section>

    <!-- REGISTER FORM -->
    <section id="register-form" class="hidden">
        <form id="userRegisterForm">
            <div class="form-group">
                <label for="regName">Nama Lengkap:</label>
                <input type="text" id="regName" name="regName" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email:</label>
                <input type="email" id="regEmail" name="regEmail" placeholder="Masukkan email" required>
            </div>
            <div class="form-group">
                <label for="regUsername">Username:</label>
                <input type="text" id="regUsername" name="regUsername" placeholder="Buat username" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password:</label>
                <input type="password" id="regPassword" name="regPassword" placeholder="Buat password" required>
            </div>
            <button type="submit">Daftar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Litera Space. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
